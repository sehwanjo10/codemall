<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자동차 로고 월드컵</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <h1 class="title">🚗 자동차 로고 월드컵 🏆</h1>
            <p class="subtitle">가장 멋진 자동차 마크를 골라보자!</p>
            <button id="start-btn" class="primary-btn">게임 시작하기!</button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <div class="header">
                <h2 id="round-info">32강</h2>
                <div class="progress-container">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
            </div>
            
            <div class="battle-arena">
                <div id="card-left" class="logo-card">
                    <img id="img-left" src="" alt="로고 1">
                    <div id="name-left" class="brand-name"></div>
                </div>
                
                <div class="vs-badge">VS</div>
                
                <div id="card-right" class="logo-card">
                    <img id="img-right" src="" alt="로고 2">
                    <div id="name-right" class="brand-name"></div>
                </div>
            </div>

            <!-- Deck Area for advanced cards -->
            <div id="deck-area" class="deck-area">
                <div class="deck-title">✨ 다음 라운드 진출 ✨</div>
                <div id="deck-cards" class="deck-cards"></div>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen">
            <h1 class="title">🎉 최종 우승! 🎉</h1>
            <div class="winner-display">
                <img id="winner-img" src="" alt="우승 로고">
                <h2 id="winner-name" class="winner-name"></h2>
            </div>
            <button id="restart-btn" class="primary-btn">다시 하기</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
