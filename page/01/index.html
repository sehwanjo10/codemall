<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자동차 로고 월드컵</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RC9SDDC0BN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-RC9SDDC0BN');
    </script>
</head>
<body>
    <div class="app-container">
        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <h1 class="title">🚗 자동차 로고 월드컵 🏆</h1>
            <p class="subtitle">가장 멋진 자동차 마크를 골라보자!</p>
            <button id="start-btn" class="primary-btn">게임 시작하기!</button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <div class="header">
                <h2 id="round-info">32강</h2>
                <div class="progress-container">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
            </div>
            
            <div class="battle-arena">
                <div id="card-left" class="logo-card">
                    <img id="img-left" src="" alt="로고 1">
                    <div id="name-left" class="brand-name"></div>
                </div>
                
                <div class="vs-badge">VS</div>
                
                <div id="card-right" class="logo-card">
                    <img id="img-right" src="" alt="로고 2">
                    <div id="name-right" class="brand-name"></div>
                </div>
            </div>

            <!-- Deck Area for advanced cards -->
            <div id="deck-area" class="deck-area">
                <div class="deck-title">✨ 다음 라운드 진출 ✨</div>
                <div id="deck-cards" class="deck-cards"></div>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen">
            <h1 class="title">🎉 최종 우승! 🎉</h1>
            
            <div id="share-card-content" class="share-card">
                <div class="winner-display">
                    <img id="res-winner-img" src="" alt="우승 로고">
                    <h2 class="winner-subtitle">오늘의 선택 결과는?</h2>
                </div>
                
                <div class="result-analysis">
                    <div class="main-type">
                        <span id="res-main-emoji" class="type-emoji"></span>
                        <h3 id="res-main-title" class="type-title"></h3>
                    </div>
                    <p id="res-main-desc" class="type-desc"></p>
                    
                    <div id="res-badges" class="badges-container"></div>

                    <div id="res-radar" class="radar-container"></div>

                    <p id="res-compare" class="compare-comment" style="display:none;"></p>
                </div>
                
            </div>
            
            <!-- Coupang Partners Ads -->
            <div class="coupang-ads-container">
                <h3 class="coupang-ads-title">🛸 아빠가 추천하는 추천 꿀템!</h3>
                <div class="coupang-ads-iframes-wrapper">
                    <div class="coupang-ads-iframes">
                        <iframe src="https://coupa.ng/coexH6" width="120" height="240" frameborder="0" scrolling="no" referrerpolicy="unsafe-url" browsingtopics></iframe>
                        <iframe src="https://coupa.ng/coex1G" width="120" height="240" frameborder="0" scrolling="no" referrerpolicy="unsafe-url" browsingtopics></iframe>
                        <iframe src="https://coupa.ng/coex5t" width="120" height="240" frameborder="0" scrolling="no" referrerpolicy="unsafe-url" browsingtopics></iframe>
                    </div>
                </div>
                <p class="coupang-ads-notice">이 포스팅은 쿠팡 파트너스 활동의 일환으로,<br>이에 따른 일정액의 수수료를 제공받습니다.</p>
            </div>
            
            <div class="action-buttons">
                <button id="download-btn" class="secondary-btn">결과 저장하기</button>
                <button id="restart-btn" class="primary-btn">다시 하기</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
